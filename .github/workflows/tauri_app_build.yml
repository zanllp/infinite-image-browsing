name: tauri_app_build

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [build, verify-windows, build-macos, stage-macos-draft, verify-draft]
        default: build
      draft_tag:
        type: string
        default: v1.11.0
      artifact_run_id:
        type: string
      baseline_tag:
        type: string
        default: v1.10.1
  push:
    branches:    
      - 'releases/**'

env:
  IIB_UPDATER_PUBLIC_KEY: ${{ vars.IIB_UPDATER_PUBLIC_KEY }}

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'build' || inputs.mode == 'verify-windows'
    strategy:
      matrix:
        os: [windows-latest]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
    steps:
      - name: Check-out repository
        uses: actions/checkout@v4

      - run: echo "VERSION=$(jq -r '.package.version' vue/src-tauri/tauri.conf.json)" >> "$GITHUB_ENV"
        if: matrix.os == 'ubuntu-22.04'
      - run: echo "VERSION=$(jq -r '.package.version' vue/src-tauri/tauri.conf.json)" >> $env:GITHUB_ENV
        if: matrix.os == 'windows-latest'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' 
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt

      - name: Install FFmpeg
        run: choco install ffmpeg -y

      - name: Install Dependencies
        run: |
          pip install --only-binary :all: av==14.0.1
          pip install -r requirements.txt

      - name: Build Executable
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: app.py
          output-file: iib_api_server
          output-dir: out
          include-module: imageio.plugins.pyav
          include-data-dir: |
            vue/dist=vue/dist
          # 固定解压目录：第一次运行解压，之后每次启动直接复用已解压的内容。
          # 默认是 {TEMP}/onefile_{PID}_{TIME}_{RANDOM}，每次启动都要重新解压 ~200MB（冷启动 4-7 秒），
          # 而且被强杀时临时目录不会回收（每启动一次留一个 ~200MB 的 onefile_* 目录）。
          onefile-tempdir-spec: '{CACHE_DIR}/iib_api_server'
      
      - run: cp out/iib_api_server out/iib_app_cli-${{ env.VERSION }}-${{ runner.os }}
        if: matrix.os == 'ubuntu-22.04'
      - run: cp out/iib_api_server.exe out/iib_app_cli-${{ env.VERSION }}-${{ runner.os }}.exe
        if: matrix.os == 'windows-latest'
      
      - name: Upload Server Artifacts
        if: inputs.mode != 'verify-windows'
        uses: actions/upload-artifact@v4
        with:
          name: iib_app_cli_${{ runner.os }}
          path: |
            out/iib_app_cli-${{ env.VERSION }}-${{ runner.os }}
            out/iib_app_cli-${{ env.VERSION }}-${{ runner.os }}.exe

      - name: Upload Server Artifacts
        if: inputs.mode != 'verify-windows'
        uses: actions/upload-artifact@v4
        with:
          name: iib_api_server-${{ env.VERSION }}-${{ runner.os }}
          path: |
            out/iib_api_server.exe
            out/iib_api_server
      
      - run: mv out/iib_api_server.exe vue/src-tauri/iib_api_server-x86_64-pc-windows-msvc.exe
        if: matrix.os == 'windows-latest'

      - run: mv out/iib_api_server vue/src-tauri/iib_api_server-x86_64-unknown-linux-gnu
        if: matrix.os == 'ubuntu-22.04'

      - name: Install frontend dependencies
        run: yarn install
        working-directory: vue

      - name: Rust setup
        # Match the compiler used for the working v1.10.1 Windows installers.
        uses: dtolnay/rust-toolchain@1.99.1
        
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './vue/src-tauri -> target'

      - name: Install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev webkit2gtk-4.0 libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build the updatable NSIS installer
        shell: bash
        working-directory: vue
        run: |
          python ../tools/release/desktop_update.py config windows-x86_64 updater.json
          yarn tauri-build --features desktop-updater --bundles nsis --config updater.json

      - name: Verify Windows installer before attaching to a draft
        shell: bash
        run: python tests/desktop/verify_draft_asset.py "vue/src-tauri/target/release/bundle/nsis/Infinite Image Browsing_${VERSION}_x64-setup.exe" verification

      - name: Package the verified installer for in-app updates
        shell: bash
        env:
          IIB_UPDATER_PRIVATE_KEY: ${{ secrets.IIB_UPDATER_PRIVATE_KEY }}
          IIB_UPDATER_KEY_PASSWORD: ${{ secrets.IIB_UPDATER_KEY_PASSWORD }}
        run: |
          dir=vue/src-tauri/target/release/bundle/nsis
          python tools/release/desktop_update.py pack windows-x86_64 "$dir/Infinite Image Browsing_${VERSION}_x64-setup.exe" "$dir"

      - name: Verify unattended Windows update and relaunch
        shell: pwsh
        run: |
          $zip = (Get-ChildItem vue/src-tauri/target/release/bundle/nsis/IIB-*.nsis.zip).FullName
          ./tests/desktop/verify_windows_update.ps1 -Archive $zip

      - name: Click Update now and verify the restarted app
        timeout-minutes: 18
        if: inputs.mode == 'verify-windows'
        run: |
          python -m pip install trustme psutil
          python tests/desktop/verify_windows_in_app_update.py

      - name: Upload Windows verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-verification-windows
          path: |
            verification/*.json
            verification/*.log
      
      - name: Upload Artifacts
        if: inputs.mode != 'verify-windows'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ env.VERSION }}-${{ runner.os }}
          path: |
            vue/src-tauri/target/release/bundle/nsis/Infinite Image Browsing_${{ env.VERSION }}_x64-setup.exe
            vue/src-tauri/target/release/bundle/nsis/IIB-*.nsis.zip*
            vue/src-tauri/target/release/bundle/nsis/latest-*.json
            vue/src-tauri/target/release/bundle/deb/infinite-image-browsing_${{ env.VERSION }}_amd64.deb


  build-by-pyinstaller:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'build' || inputs.mode == 'verify-windows'
    strategy:
      matrix:
        os: [windows-latest]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
    steps:
      - name: Check-out repository
        uses: actions/checkout@v4

      - run: echo "VERSION=$(jq -r '.package.version' vue/src-tauri/tauri.conf.json)" >> $env:GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' 
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt

      - name: Install FFmpeg
        run: choco install ffmpeg -y

      - name: Install Dependencies
        run: |
          pip install --only-binary :all: av==14.0.1
          pip install -r requirements.txt

      - uses: sayyid5416/pyinstaller@v1
        with:
            spec: 'app.py'
            upload_exe_with_name: ${{ inputs.mode != 'verify-windows' && 'My executable' || '' }}
            options: --onefile --additional-hooks-dir=pyinstaller_hooks --add-data "vue/dist;vue/dist"

      - run: mv dist/app.exe vue/src-tauri/iib_api_server-x86_64-pc-windows-msvc.exe

      - name: Install frontend dependencies
        run: yarn install
        working-directory: vue

      - name: Rust setup
        uses: dtolnay/rust-toolchain@1.99.1
        
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './vue/src-tauri -> target'

      - name: Install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev webkit2gtk-4.0 libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build the updatable NSIS installer
        shell: bash
        working-directory: vue
        run: |
          python ../tools/release/desktop_update.py config windows-x86_64-pyinstaller updater.json
          yarn tauri-build --features desktop-updater --bundles nsis --config updater.json
      
      - run: |
         cd vue/src-tauri/target/release/bundle/nsis
         mv "Infinite Image Browsing_${{ env.VERSION }}_x64-setup.exe" "Infinite Image Browsing_${{ env.VERSION }}_x64-setup-pyinstaller.exe"

      - name: Verify alternative Windows installer before attaching to a draft
        shell: bash
        run: python tests/desktop/verify_draft_asset.py "vue/src-tauri/target/release/bundle/nsis/Infinite Image Browsing_${VERSION}_x64-setup-pyinstaller.exe" verification

      - name: Package the verified installer for in-app updates
        shell: bash
        env:
          IIB_UPDATER_PRIVATE_KEY: ${{ secrets.IIB_UPDATER_PRIVATE_KEY }}
          IIB_UPDATER_KEY_PASSWORD: ${{ secrets.IIB_UPDATER_KEY_PASSWORD }}
        run: |
          dir=vue/src-tauri/target/release/bundle/nsis
          python tools/release/desktop_update.py pack windows-x86_64-pyinstaller "$dir/Infinite Image Browsing_${VERSION}_x64-setup-pyinstaller.exe" "$dir"

      - name: Verify unattended Windows update and relaunch
        shell: pwsh
        run: |
          $zip = (Get-ChildItem vue/src-tauri/target/release/bundle/nsis/IIB-*.nsis.zip).FullName
          ./tests/desktop/verify_windows_update.ps1 -Archive $zip

      - name: Click Update now and verify the restarted app
        timeout-minutes: 18
        if: inputs.mode == 'verify-windows'
        run: |
          python -m pip install trustme psutil
          python tests/desktop/verify_windows_in_app_update.py

      - name: Upload Windows verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-verification-windows-pyinstaller
          path: |
            verification/*.json
            verification/*.log
      - name: Upload Artifacts
        if: inputs.mode != 'verify-windows'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ env.VERSION }}-${{ runner.os }}-pre
          path: |
            vue/src-tauri/target/release/bundle/nsis/Infinite Image Browsing_${{ env.VERSION }}_x64-setup-pyinstaller.exe
            vue/src-tauri/target/release/bundle/nsis/IIB-*.nsis.zip*
            vue/src-tauri/target/release/bundle/nsis/latest-*.json
            
  build-macos:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'build' || inputs.mode == 'build-macos'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      # The selected NumPy macOS wheel requires macOS 14 or newer.
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      # Keep hnswlib portable instead of targeting the CI runner's CPU.
      HNSWLIB_NO_NATIVE: '1'
    steps:
      - uses: actions/checkout@v4

      - run: echo "VERSION=$(jq -r '.package.version' vue/src-tauri/tauri.conf.json)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          python -m venv "$RUNNER_TEMP/iib-build-venv"
          echo "$RUNNER_TEMP/iib-build-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/iib-build-venv/bin/python" -m pip install --upgrade pip setuptools==84.2.1
          "$RUNNER_TEMP/iib-build-venv/bin/python" -m pip install -r requirements.txt av==14.0.1 pyinstaller==6.16.0 imageio-ffmpeg
          yarn --cwd vue install --frozen-lockfile

      # Embed the standalone frontend before Tauri rebuilds it with its own base URL.
      - name: Build standalone frontend
        run: yarn --cwd vue build

      - name: Test desktop resource paths and parent watchdog
        run: python -m unittest discover -s tests/unit -p 'test_*.py'

      - name: Build Python sidecar
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name iib_api_server \
            --additional-hooks-dir pyinstaller_hooks --add-data "vue/dist:vue/dist" app.py
          cp dist/iib_api_server "vue/src-tauri/iib_api_server-${{ matrix.target }}"

      - name: Rust setup
        uses: dtolnay/rust-toolchain@1.85.1

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './vue/src-tauri -> target'

      - name: Build application bundle
        run: |
          python ../tools/release/desktop_update.py config darwin-${{ matrix.arch }} updater.json
          yarn tauri-build --features desktop-updater --bundles app --config updater.json
        working-directory: vue

      - name: Package and verify ad-hoc signed application
        run: |
          bash tools/release/package_macos.sh \
            "vue/src-tauri/target/release/bundle/macos/Infinite Image Browsing.app" \
            out "${{ env.VERSION }}" "${{ matrix.arch }}"

      - name: Exercise the final desktop bundle
        run: |
          python tests/desktop/smoke_test_desktop.py --app \
            "vue/src-tauri/target/release/bundle/macos/Infinite Image Browsing.app"
          python tests/desktop/smoke_test_desktop.py \
            "vue/src-tauri/target/release/bundle/macos/Infinite Image Browsing.app/Contents/MacOS/iib_api_server"

      - name: Package the final ad-hoc signed app for in-app updates
        env:
          IIB_UPDATER_PRIVATE_KEY: ${{ secrets.IIB_UPDATER_PRIVATE_KEY }}
          IIB_UPDATER_KEY_PASSWORD: ${{ secrets.IIB_UPDATER_KEY_PASSWORD }}
        run: |
          python tools/release/desktop_update.py pack darwin-${{ matrix.arch }} \
            "vue/src-tauri/target/release/bundle/macos/Infinite Image Browsing.app" out

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ env.VERSION }}-macOS-${{ matrix.arch }}
          path: |
            out/*-unsigned.dmg
            out/IIB-*.app.tar.gz*
            out/latest-*.json
          if-no-files-found: error

  release:
    if: (startsWith(github.ref, 'refs/heads/releases/') && github.event_name != 'workflow_dispatch') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'build')
    needs: [build-by-pyinstaller, build, build-macos]
    runs-on: ubuntu-latest

    permissions:
      contents: write
    steps:
      - name: Check-out repository
        uses: actions/checkout@v4
      - run: echo "VERSION=$(jq -r '.package.version' vue/src-tauri/tauri.conf.json)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: bundle-${{ env.VERSION }}-Windows
          path: artifacts
          
      - uses: actions/download-artifact@v4
        with:
          name: bundle-${{ env.VERSION }}-Windows-pre
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: iib_app_cli_Windows
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-${{ env.VERSION }}-macOS-*
          merge-multiple: true
          path: artifacts

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: docs/releases/v${{ env.VERSION }}.md
          files: artifacts/**/*

  stage-macos-draft:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'stage-macos-draft'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DRAFT_TAG: ${{ inputs.draft_tag }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
    steps:
      - name: Require a successful build and an unpublished draft
        run: |
          gh run view "$ARTIFACT_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion' | grep -qx success
          gh release view "$DRAFT_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' | grep -qx true
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id }}
          pattern: bundle-*-macOS-*
          path: artifacts
          merge-multiple: true
      - name: Attach verified macOS installers without publishing
        run: |
          for channel in darwin-x64 darwin-aarch64; do
            jq -e --arg tag "$DRAFT_TAG" '("v" + .version) == $tag' "artifacts/latest-$channel.json"
          done
          gh release upload "$DRAFT_TAG" artifacts/*.dmg artifacts/*.app.tar.gz{,.sig} artifacts/latest-*.json --repo "$GITHUB_REPOSITORY" --clobber

  verify-draft:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'verify-draft'
    timeout-minutes: 15
    # Historical installers are diagnostic controls, not release candidates.
    continue-on-error: ${{ matrix.baseline || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            variant: windows
            pattern: '*_x64-setup.exe'
          - os: windows-latest
            variant: windows-pyinstaller
            pattern: '*_x64-setup-pyinstaller.exe'
          - os: windows-latest
            variant: windows-cli
            pattern: 'iib_app_cli-*-Windows.exe'
          - os: windows-latest
            variant: baseline-windows
            pattern: '*_x64-setup.exe'
            baseline: true
          - os: windows-latest
            variant: baseline-windows-pyinstaller
            pattern: '*_x64-setup-pyinstaller.exe'
            baseline: true
          - os: macos-15-intel
            variant: macos-x64
            pattern: '*_x64-unsigned.dmg'
          - os: macos-15
            variant: macos-aarch64
            pattern: '*_aarch64-unsigned.dmg'
    runs-on: ${{ matrix.os }}
    permissions:
      # GitHub only exposes unpublished drafts to tokens with push access.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DRAFT_TAG: ${{ inputs.draft_tag }}
      ASSET_PATTERN: ${{ matrix.pattern }}
      BASELINE_TEST: ${{ matrix.baseline || false }}
      BASELINE_TAG: ${{ inputs.baseline_tag }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test fixture dependencies
        run: python -m pip install av==14.0.1 Pillow
      - name: Download actual draft release asset
        shell: bash
        run: |
          tag="$DRAFT_TAG"
          if [ "$BASELINE_TEST" = true ]; then
            tag="$BASELINE_TAG"
          else
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' | grep -qx true
          fi
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_PATTERN" --dir downloads
      - name: Install and exercise downloaded artifact
        shell: bash
        run: |
          python tests/desktop/verify_draft_asset.py downloads/* verification
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-verification-${{ matrix.variant }}
          path: |
            verification/*.json
            verification/*.log
            verification/*.png
            verification/*.stdout
            verification/*.stderr
