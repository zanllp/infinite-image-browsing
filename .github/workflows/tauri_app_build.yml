name: tauri_app_build

on:
  workflow_dispatch:
  push:
    branches:    
      - 'releases/**'

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write
    steps:
      - name: Check-out repository
        uses: actions/checkout@v4

      - run: echo "VERSION=$(jq -r '.package.version' vue/src-tauri/tauri.conf.json)" >> "$GITHUB_ENV"
        if: matrix.os == 'ubuntu-22.04'
      - run: echo "VERSION=$(jq -r '.package.version' vue/src-tauri/tauri.conf.json)" >> $env:GITHUB_ENV
        if: matrix.os == 'windows-latest'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' 
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt

      - name: Install FFmpeg
        run: choco install ffmpeg -y

      - name: Install Dependencies
        run: |
          pip install --only-binary :all: av==14.0.1
          pip install -r requirements.txt

      - name: Build Executable
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: app.py
          output-file: iib_api_server
          output-dir: out
          include-module: imageio.plugins.pyav
          include-data-dir: |
            vue/dist=vue/dist
          # 固定解压目录：第一次运行解压，之后每次启动直接复用已解压的内容。
          # 默认是 {TEMP}/onefile_{PID}_{TIME}_{RANDOM}，每次启动都要重新解压 ~200MB（冷启动 4-7 秒），
          # 而且被强杀时临时目录不会回收（每启动一次留一个 ~200MB 的 onefile_* 目录）。
          onefile-tempdir-spec: '{CACHE_DIR}/iib_api_server'
      
      - run: cp out/iib_api_server out/iib_app_cli-${{ env.VERSION }}-${{ runner.os }}
        if: matrix.os == 'ubuntu-22.04'
      - run: cp out/iib_api_server.exe out/iib_app_cli-${{ env.VERSION }}-${{ runner.os }}.exe
        if: matrix.os == 'windows-latest'
      
      - name: Upload Server Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iib_app_cli_${{ runner.os }}
          path: |
            out/iib_app_cli-${{ env.VERSION }}-${{ runner.os }}
            out/iib_app_cli-${{ env.VERSION }}-${{ runner.os }}.exe

      - name: Upload Server Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iib_api_server-${{ env.VERSION }}-${{ runner.os }}
          path: |
            out/iib_api_server.exe
            out/iib_api_server
      
      - run: mv out/iib_api_server.exe vue/src-tauri/iib_api_server-x86_64-pc-windows-msvc.exe
        if: matrix.os == 'windows-latest'

      - run: mv out/iib_api_server vue/src-tauri/iib_api_server-x86_64-unknown-linux-gnu
        if: matrix.os == 'ubuntu-22.04'

      - name: Install frontend dependencies
        run: yarn install
        working-directory: vue

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './vue/src-tauri -> target'

      - name: Install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev webkit2gtk-4.0 libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build the app
        run: |
          yarn tauri-build
        working-directory: vue
      
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ env.VERSION }}-${{ runner.os }}
          path: |
            vue/src-tauri/target/release/bundle/nsis/Infinite Image Browsing_${{ env.VERSION }}_x64-setup.exe
            vue/src-tauri/target/release/bundle/deb/infinite-image-browsing_${{ env.VERSION }}_amd64.deb


  build-by-pyinstaller:
    strategy:
      matrix:
        os: [windows-latest]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write
    steps:
      - name: Check-out repository
        uses: actions/checkout@v4

      - run: echo "VERSION=$(jq -r '.package.version' vue/src-tauri/tauri.conf.json)" >> $env:GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' 
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt

      - name: Install FFmpeg
        run: choco install ffmpeg -y

      - name: Install Dependencies
        run: |
          pip install --only-binary :all: av==14.0.1
          pip install -r requirements.txt

      - uses: sayyid5416/pyinstaller@v1
        with:
            spec: 'app.py'
            upload_exe_with_name: 'My executable'
            options: --onefile --additional-hooks-dir=pyinstaller_hooks --add-data "vue/dist;vue/dist"

      - run: mv dist/app.exe vue/src-tauri/iib_api_server-x86_64-pc-windows-msvc.exe

      - name: Install frontend dependencies
        run: yarn install
        working-directory: vue

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './vue/src-tauri -> target'

      - name: Install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev webkit2gtk-4.0 libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build the app
        run: |
          yarn tauri-build
        working-directory: vue
      
      - run: |
         cd vue/src-tauri/target/release/bundle/nsis
         mv "Infinite Image Browsing_${{ env.VERSION }}_x64-setup.exe" "Infinite Image Browsing_${{ env.VERSION }}_x64-setup-pyinstaller.exe"
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ env.VERSION }}-${{ runner.os }}-pre
          path: |
            vue/src-tauri/target/release/bundle/nsis/Infinite Image Browsing_${{ env.VERSION }}_x64-setup-pyinstaller.exe
            
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      # The selected NumPy macOS wheel requires macOS 14 or newer.
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      # Keep hnswlib portable instead of targeting the CI runner's CPU.
      HNSWLIB_NO_NATIVE: '1'
    steps:
      - uses: actions/checkout@v4

      - run: echo "VERSION=$(jq -r '.package.version' vue/src-tauri/tauri.conf.json)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt av==14.0.1 pyinstaller==6.16.0 imageio-ffmpeg
          yarn --cwd vue install --frozen-lockfile

      # Embed the standalone frontend before Tauri rebuilds it with its own base URL.
      - name: Build standalone frontend
        run: yarn --cwd vue build

      - name: Test desktop resource paths and parent watchdog
        run: python -m unittest scripts.iib.test_frozen_resources scripts.iib.test_parent_watchdog

      - name: Build Python sidecar
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name iib_api_server \
            --additional-hooks-dir pyinstaller_hooks --add-data "vue/dist:vue/dist" app.py
          cp dist/iib_api_server "vue/src-tauri/iib_api_server-${{ matrix.target }}"

      - name: Rust setup
        uses: dtolnay/rust-toolchain@1.85.1

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './vue/src-tauri -> target'

      - name: Build application bundle
        run: yarn tauri-build --bundles app
        working-directory: vue

      - name: Package and verify ad-hoc signed application
        run: |
          bash scripts/package_macos.sh \
            "vue/src-tauri/target/release/bundle/macos/Infinite Image Browsing.app" \
            out "${{ env.VERSION }}" "${{ matrix.arch }}"

      - name: Exercise the final desktop bundle
        run: |
          python scripts/smoke_test_desktop.py --app \
            "vue/src-tauri/target/release/bundle/macos/Infinite Image Browsing.app"
          python scripts/smoke_test_desktop.py \
            "vue/src-tauri/target/release/bundle/macos/Infinite Image Browsing.app/Contents/MacOS/iib_api_server"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ env.VERSION }}-macOS-${{ matrix.arch }}
          path: out/*-unsigned.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/heads/releases/')
    needs: [build-by-pyinstaller, build, build-macos]
    runs-on: ubuntu-latest

    permissions:
      contents: write
    steps:
      - name: Check-out repository
        uses: actions/checkout@v4
      - run: echo "VERSION=$(jq -r '.package.version' vue/src-tauri/tauri.conf.json)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: bundle-${{ env.VERSION }}-Windows
          path: artifacts
          
      - uses: actions/download-artifact@v4
        with:
          name: bundle-${{ env.VERSION }}-Windows-pre
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: iib_app_cli_Windows
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-${{ env.VERSION }}-macOS-*
          merge-multiple: true
          path: artifacts

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: docs/releases/v${{ env.VERSION }}.md
          files: artifacts/**/*
          
